# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild build -project xpartan.xcodeproj -scheme xpartan -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO
    # - name: Run tests
    #   run: xcodebuild test -project xpartan.xcodeproj -scheme xpartan -destination "platform=iOS Simulator,name=iPhone 16" CODE_SIGNING_ALLOWED=NO
